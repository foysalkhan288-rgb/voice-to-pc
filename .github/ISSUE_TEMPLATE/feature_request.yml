name: Feature request
description: Suggest an idea for SpeakType
title: "[Feature] "
labels: enhancement
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the problem you want to solve, not just the solution.
      placeholder: e.g. I want to dictate into reports while I am away from my desk...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your idea clearly and concisely.
      placeholder: e.g. Add a setting to...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you have considered.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant (screenshots, mockups, links).
    validations:
      required: false
