name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android-app
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug

      # Production signing: if a release keystore Secret is present, restore it.
      # Otherwise the release build silently falls back to the shared debug key.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android-app/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android-app/app/keystore/release.jks
          ls -la android-app/app/keystore/

      - name: Build release APK
        working-directory: android-app
        env:
          KEYSTORE_FILE: ../app/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleRelease

      - name: Generate checksums
        run: |
          cd android-app/app/build/outputs/apk
          sha256sum debug/app-debug.apk release/app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Save APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: speaktype-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Android build
          files: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/SHA256SUMS.txt
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-tests:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install helper dependencies
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run helper tests
        working-directory: windows
        run: python -m pytest tests/ -q
