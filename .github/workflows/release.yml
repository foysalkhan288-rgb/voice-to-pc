name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.7.6)
        required: true

permissions:
  contents: write

jobs:
  android:
    name: Android builds
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android-app
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android-app/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android-app/app/keystore/release.jks

      - name: Build release APK
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'app/keystore/release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleRelease

      - name: Save builds as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speaktype-android
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows-exe:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build SpeakType.exe
        working-directory: windows
        run: >
          pyinstaller --noconfirm --onefile --windowed --name SpeakType
          --icon assets\speaktype.ico --collect-all customtkinter
          --add-data "gui;gui" --add-data "settings.py;." --add-data "assets;assets"
          speaktype.py

      - name: Save exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: speaktype-windows
          path: windows/dist/SpeakType.exe
          if-no-files-found: error

  publish:
    name: Publish versioned release
    needs: [android, windows-exe]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: speaktype-*
          merge-multiple: true
          path: dist

      # upload-artifact keeps the debug/ and release/ subfolders; flatten them
      # so checksums and release assets use plain file names.
      - name: Flatten APK paths
        run: |
          cd dist
          mv debug/app-debug.apk release/app-release.apk .
          rmdir debug release

      - name: Generate checksums
        run: |
          cd dist
          sha256sum SpeakType.exe app-debug.apk app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from changelog
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          awk -v t="## [$TAG]" 'index($0,t)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SpeakType ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          files: dist/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}